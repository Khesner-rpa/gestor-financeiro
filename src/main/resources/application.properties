# ==========================================
# IDENTIFICAÇÃO DA APLICAÇÃO
# ==========================================
spring.application.name=gestor-financeiro

# ==========================================
# BANCO DE DADOS
# ==========================================
# Em producao (Render): defina DB_URL, DB_USERNAME, DB_PASSWORD e DB_DRIVER
# como variaveis de ambiente no painel do Render.
# Localmente: defina as mesmas variaveis no ambiente (veja .env.example).
spring.datasource.url=${DB_URL}
spring.datasource.username=${DB_USERNAME}
spring.datasource.password=${DB_PASSWORD}
spring.datasource.driver-class-name=${DB_DRIVER:org.postgresql.Driver}

# ==========================================
# PERSISTÊNCIA (JPA)
# ==========================================
spring.jpa.open-in-view=false
spring.jpa.hibernate.ddl-auto=validate
spring.flyway.baseline-on-migrate=true
spring.flyway.enabled=true

# ==========================================
# SEGURANÇA DE SESSÃO (WEB/HTTP)
# ==========================================
server.servlet.session.cookie.http-only=true
server.servlet.session.cookie.same-site=strict
server.servlet.session.cookie.secure=${SESSION_COOKIE_SECURE:false}
server.servlet.session.timeout=30m

# ==========================================
# SEGURANÇA DE ERROS (PRIVACIDADE)
# ==========================================
server.error.include-message=never
server.error.include-binding-errors=never
server.error.include-stacktrace=never

# ==========================================
# MONITORAMENTO E PORTA
# ==========================================
management.endpoints.web.exposure.include=health
management.endpoint.health.show-details=never
server.port=${PORT:8080}